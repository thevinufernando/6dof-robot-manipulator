# YASKAWA GP7 joint limits, expressed for the DH joint variables q_i
# (positive q_i = right-handed rotation about Z_{i-1} of the DH frames).
#
# Source: GP7 datasheet docs/datasheets/motoman_GP7.pdf p.2 (range, max speed).
# Effort [N m]: NOT in the datasheet - simulation values big enough to hold the
# arm + 7 kg payload in Gazebo.
#
# Mapping datasheet (Yaskawa pendant) ranges onto DH directions at home pose:
#   S  Z0 = up        : +q1 = Yaskawa S+                      -> +/-170
#   L  Z1 = -Y0       : +q2 tilts the lower arm BACKWARD; Yaskawa L+ is forward
#                       (+145 fwd / -65 back)                 -> q2 in [-145, +65]
#   U  Z2 = -Y0       : +q3 lifts the forearm = Yaskawa U+    -> q3 in [-70, +190]
#   R  Z3 = +X (fore) : symmetric                             -> +/-190
#   B  Z4 = -Y0       : +q5 bends the wrist up                -> +/-135
#   T  Z5 = +X (fore) : symmetric                             -> +/-360
joint_1_s: {lower_deg: -170.0, upper_deg: 170.0, velocity_deg_s: 375.0,  effort: 500.0}
joint_2_l: {lower_deg: -145.0, upper_deg:  65.0, velocity_deg_s: 315.0,  effort: 500.0}
joint_3_u: {lower_deg:  -70.0, upper_deg: 190.0, velocity_deg_s: 410.0,  effort: 250.0}
joint_4_r: {lower_deg: -190.0, upper_deg: 190.0, velocity_deg_s: 550.0,  effort: 50.0}
joint_5_b: {lower_deg: -135.0, upper_deg: 135.0, velocity_deg_s: 550.0,  effort: 50.0}
joint_6_t: {lower_deg: -360.0, upper_deg: 360.0, velocity_deg_s: 1000.0, effort: 25.0}
