# YASKAWA GP7 nominal kinematic dimensions [m].
#
# Single source of truth: read by the URDF (urdf/gp7_macro.xacro) and by
# tools/prepare_meshes.py. Later, the D-H / IK code should read it too.
#
# Values are GP7 nominal dimensions, confirmed on the STL meshes by locating
# each joint axis from its concentric holes/bores (tools/measure_joint_axes.py):
#   d1 : base housing top 198 mm + S-head bottom 132 mm below L-axis => 330 mm
#   a1 : measured 40.0 mm
#   a2 : measured 445.0 mm
#   a3 : measured 40.0 mm
#   d4 : nominal 440 mm (J5 bores sit 119.3 mm ahead of the forearm part origin;
#        forearm tube then sits 1.5 mm clear of the U-casing lip)
#   d6 : flange face is 80 mm from the B-axis (flange part nests in link_5_b)
#
# Home pose (all joints = 0): L-arm vertical, forearm horizontal pointing +X.
d1: 0.330   # floor -> J2 (L-axis) height
a1: 0.040   # J1 (S) axis -> J2 (L) axis, horizontal offset
a2: 0.445   # J2 (L) -> J3 (U), lower-arm length
a3: 0.040   # J3 (U) -> J4 (R) axis, vertical offset
d4: 0.440   # J3 (U) -> J5 (B), along the forearm
d6: 0.080   # J5 (B) -> tool flange face
