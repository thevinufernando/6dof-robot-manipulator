# Robotiq 2F-85 on the GP7.
#
# Geometry, meshes and inertials come from Robotiq's robotiq_description (git submodule
# ros2_ws/src/robotiq-ros). Measured grasp geometry (pad gap vs knuckle angle, pad
# height, TCP, lever arms) is in gripper_geometry.yaml, generated by
# tools/robotiq_2f85_geometry.py.
#
# The 2F-85 has ONE degree of freedom: the knuckle angle theta
# (robotiq_85_left_knuckle_joint, 0 = open (84 mm between the pads) .. 0.8 rad = closed). The other five
# joints mimic it: q_joint = multiplier * theta. Gazebo's DART engine cannot enforce
# mimic constraints, so in simulation all six joints are driven by gripper_controller
# with the references computed from these multipliers (software mimic).
#
# Frames: gripper_coupling sits on the GP7 flange (tool0); the Robotiq base is turned
# 90 deg about the tool's Z so the fingers close along the tool's Y axis (the
# convention the planner uses). gripper_tcp = pad centre at the reference object width.
# Units: metres, radians, newtons.

model: robotiq_2f85

mount:
  coupling: {radius: 0.0375, length: 0.012, mass: 0.10}   # GP7 ISO 9409-1-31.5 flange -> Robotiq base
  yaw_deg: 90.0                                            # fingers close along the tool's Y

driven_joint: robotiq_85_left_knuckle_joint
joints:                       # joint name: mimic multiplier (q = multiplier * theta)
  robotiq_85_left_knuckle_joint: 1.0
  robotiq_85_right_knuckle_joint: -1.0
  robotiq_85_left_inner_knuckle_joint: 1.0
  robotiq_85_right_inner_knuckle_joint: -1.0
  robotiq_85_left_finger_tip_joint: -1.0
  robotiq_85_right_finger_tip_joint: 1.0
theta_open: 0.0
theta_closed: 0.8

friction_mu: 1.5              # finger-tip pad friction in Gazebo
# Contact pads: a thin BOX collision on each fingertip, `protrusion` proud of the
# Robotiq mesh face (rectangle measured from the mesh by the geometry tool). Box-box
# contacts are clean face-face contacts; box-vs-mesh contacts let the object sink ~1 mm
# into the pad mesh, whose chamfered edges then lock it (holds regardless of mu).
pad: {protrusion: 0.0005, thickness: 0.002}
grip_force: 20.0              # default grip force per pad [N] (2F-85: 20-235 N)
open_close_time: 2.4          # s for a full open/close (0.8 rad): spline peak 1.5*0.8/2.4 = 0.5 rad/s = URDF joint limit

# Grip-force model: the knuckle PID pushes with tau = p * (theta_ref - theta) and the pad
# force is F = tau / lever (lever = knuckle axis -> pad centre, gripper_geometry.yaml),
# so a grasp commands theta_ref = theta_contact + F * lever / p.
# Must match gripper_controller gains.p of the knuckle joints in
# gp7_gazebo/config/controllers.yaml.
knuckle_p_gain: 20.0
