# Extra bridges for sim_control:=gz_plugins only (Gazebo-side joint control).
# In ros2_control mode /joint_states comes from joint_state_broadcaster and the
# gripper is commanded through gripper_controller instead.

# Joint angles measured in Gazebo (JointStatePublisher system) -> /joint_states
- ros_topic_name: /joint_states
  gz_topic_name: /world/gp7_world/model/gp7/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Gripper command (ROS -> Gazebo): finger travel in metres, 0 = open, 0.0425 = closed.
- ros_topic_name: /gp7/gripper/cmd_pos
  gz_topic_name: /gp7/gripper/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
