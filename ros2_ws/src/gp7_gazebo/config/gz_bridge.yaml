# ros_gz_bridge topics (Gazebo -> ROS only, no control yet).
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Joint angles measured in Gazebo (JointStatePublisher system) -> /joint_states,
# so robot_state_publisher / RViz show exactly what the simulator is doing.
- ros_topic_name: /joint_states
  gz_topic_name: /world/gp7_world/model/gp7/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Gripper command (ROS -> Gazebo): finger travel in metres, 0 = open, 0.0425 = closed.
# Both finger JointPositionControllers listen to this one topic.
- ros_topic_name: /gp7/gripper/cmd_pos
  gz_topic_name: /gp7/gripper/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# Box B pose in the world (PosePublisher on the box_b model) -> ROS, for the planner.
- ros_topic_name: /box_b/pose
  gz_topic_name: /model/box_b/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
